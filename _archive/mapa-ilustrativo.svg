  </g>
  <g stroke="#9C6040" stroke-width="5" stroke-linecap="round">
    <line x1="55" y1="335" x2="55" y2="317"/><circle cx="55" cy="313" r="8" fill="#8FC4B4" stroke="none"/>
    <line x1="145" y1="58" x2="145" y2="40"/><circle cx="145" cy="36" r="7" fill="#8FC4B4" stroke="none"/>
    <line x1="545" y1="330" x2="545" y2="312"/><circle cx="545" cy="308" r="8" fill="#6FAE9C" stroke="none"/>
    <line x1="95" y1="245" x2="95" y2="230"/><circle cx="95" cy="227" r="6" fill="#6FAE9C" stroke="none"/>
  </g>
  <g transform="translate(555,345)">
