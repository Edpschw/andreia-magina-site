  </g>
  <g font-family="IBM Plex Mono, monospace" font-size="11" fill="#6E645A" font-weight="500">
    <text x="70" y="365" transform="rotate(-25 70 365)">Av. das Américas</text>
    <text x="228" y="212">R. Gildásio Amado</text>
