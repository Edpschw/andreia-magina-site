      <line x1="-100" y1="230" x2="700" y2="230"/>
      <line x1="80" y1="-150" x2="80" y2="550"/>
      <line x1="300" y1="-150" x2="300" y2="550"/>
      <line x1="520" y1="-150" x2="520" y2="550"/>
    </g>
    <g filter="url(#map-shadow)">
