      <rect x="330" y="60" width="140" height="140" rx="8" fill="#DCEDE9"/>
      <rect x="110" y="260" width="130" height="90" rx="8" fill="#FBE1CC"/>
      <rect x="330" y="270" width="140" height="80" rx="8" fill="#F3E0D2"/>
    </g>
    <g fill="#FFF3E6" opacity=".55">
