<svg viewBox="0 0 600 400" role="img" aria-label="Mapa ilustrativo baseado no Google Maps, mostrando o consultório perto da Av. das Américas, Barra da Tijuca">
  <defs>
    <filter id="map-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#2D3E5E" flood-opacity=".18"/>
    </filter>
    <filter id="pin-shadow" x="-60%" y="-30%" width="220%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#2D3E5E" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="600" height="400" fill="#FFF3E6"/>
  <path d="M430 0 Q555 5 600 55 Q590 90 600 130 L600 0 Z" fill="#8FC4B4" opacity=".5"/>
  <path d="M475 0 Q575 20 600 65 Q593 95 600 125 L600 0 Z" fill="#487872" opacity=".45"/>
  <path d="M460 22 Q500 32 545 24 M485 45 Q520 54 560 47" stroke="#FFF3E6" stroke-width="2.5" stroke-linecap="round" fill="none" opacity=".55"/>
  <g transform="rotate(-25 300 200)">
