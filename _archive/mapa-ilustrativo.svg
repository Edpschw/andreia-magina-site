    <path d="M0-38c16 0 28 12 28 28 0 20-28 46-28 46s-28-26-28-46c0-16 12-28 28-28z" fill="#E695B4"/>
    <circle cx="0" cy="-10" r="11" fill="#FFF3E6"/>
