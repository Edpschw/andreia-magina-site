      <circle cx="-25" cy="-40" r="3"/><circle cx="-5" cy="-40" r="3"/><circle cx="15" cy="-40" r="3"/>
      <circle cx="365" cy="90" r="3"/><circle cx="385" cy="90" r="3"/><circle cx="405" cy="90" r="3"/>
      <circle cx="365" cy="110" r="3"/><circle cx="385" cy="110" r="3"/><circle cx="405" cy="110" r="3"/>
    </g>
